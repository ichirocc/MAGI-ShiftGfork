name: Engine JVM Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'native-cpp/**', '.github/workflows/engine-jvm-check.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: engine-jvm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jvm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Kotlin compiler
        run: |
          set -euo pipefail
          URL="https://github.com/JetBrains/kotlin/releases/download/v1.9.25/kotlin-compiler-1.9.25.zip"
          # curl exit 56 = recv error（一時ネットワーク）→ リトライ + wget フォールバック
          ok=0
          for i in 1 2 3 4 5; do
            echo "kotlinc download attempt $i..."
            if curl -fL --retry 3 --retry-delay 2 --retry-all-errors \
                --connect-timeout 30 --max-time 180 \
                "$URL" -o /tmp/kotlin.zip \
              || wget -q --tries=3 --timeout=30 -O /tmp/kotlin.zip "$URL"; then
              if [ -s /tmp/kotlin.zip ] && head -c 2 /tmp/kotlin.zip | grep -q PK; then
                ok=1
                break
              fi
            fi
            echo "attempt $i failed, sleep $((i*3))s"
            rm -f /tmp/kotlin.zip
            sleep $((i * 3))
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Failed to download kotlin-compiler after retries (curl exit 56 class)"
            exit 1
          fi
          unzip -q /tmp/kotlin.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"
          "$HOME/kotlinc/bin/kotlinc" -version

      - name: CiSmoke
        env:
          MAGI_BUDGET_MS: "2000"
          MAGI_SEEDS: "3"
        run: |
          set -euo pipefail
          STDLIB=$(find "$HOME/kotlinc" -name 'kotlin-stdlib.jar' | head -1)
          mkdir -p out
          find src -name '*.kt' | sort > /tmp/srcs.txt
          kotlinc -cp "$STDLIB" -d out @/tmp/srcs.txt
          java -cp "out:$STDLIB" com.magi.app.v6.engine.CiSmokeKt
      - name: Host native verify
        run: bash scripts/verify-native-host.sh
