# L2: app-base + fork-overlay の型整合チェック（assemble より軽い）
# 必須チェック候補。Engine 単体緑だけでは MirrorCore 不整合を見逃す。
name: Overlay Compile (L2)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fork-overlay/**'
      - '.github/workflows/overlay-compile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fork-overlay/**'
      - '.github/workflows/overlay-compile.yml'
permissions:
  contents: read
concurrency:
  group: overlay-compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay-src
      - uses: actions/checkout@v4
        with:
          repository: ichirocc/magi7ichiro-fork
          path: app-base
      - name: Apply fork-overlay
        run: |
          set -euo pipefail
          cp -a overlay-src/fork-overlay/. app-base/
      - name: Ensure plugin repositories
        working-directory: app-base
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          printf '%s\n' \
            'settingsEvaluated {' \
            '  pluginManagement.repositories.apply {' \
            '    mavenCentral()' \
            '    google()' \
            '    gradlePluginPortal()' \
            '  }' \
            '}' > "$HOME/.gradle/init.gradle.kts"
          if [ -f settings.gradle.kts ] && ! grep -q gradlePluginPortal settings.gradle.kts; then
            printf '\n%s\n' \
              'pluginManagement {' \
              '    repositories {' \
              '        google()' \
              '        mavenCentral()' \
              '        gradlePluginPortal()' \
              '    }' \
              '}' >> settings.gradle.kts
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Gradle wrapper path
        run: |
          wget -q -O /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"
      - name: compileDebugKotlin (MirrorCore type world)
        working-directory: app-base
        run: gradle :app:compileDebugKotlin --stacktrace
