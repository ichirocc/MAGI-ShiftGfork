name: Native Parity Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native-cpp/**', 'fork-overlay/app/src/main/cpp/**', '.github/workflows/native-parity.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  native-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-native-host.sh
  native-ndk-in-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay-src
      - uses: actions/checkout@v4
        with:
          repository: ichirocc/magi7ichiro-fork
          path: app-base
      - run: cp -a overlay-src/fork-overlay/. app-base/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - run: |
          wget -q -O /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"
      - name: assembleDebug
        working-directory: app-base
        run: gradle assembleDebug --stacktrace
      - name: Check .so
        working-directory: app-base
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          unzip -l "$APK" | grep 'libmagi_native.so'
