name: Rebuild Engine Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'app/src/main/java/com/magi/app/v6/engine/**'
      - 'app/src/main/cpp/**'
      - '.github/workflows/rebuild-engine-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/magi/app/v6/engine/**'
      - 'app/src/main/cpp/**'

permissions:
  contents: read

concurrency:
  group: rebuild-engine-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install kotlinc
        run: |
          mkdir -p "$HOME/kotlin"
          curl -sL "https://github.com/JetBrains/kotlin/releases/download/v1.9.25/kotlin-compiler-1.9.25.zip" -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile & CiSmoke (engine sources)
        env:
          MAGI_BUDGET_MS: "2000"
          MAGI_SEEDS: "3"
        run: |
          set -euo pipefail
          ENG="app/src/main/java/com/magi/app/v6/engine"
          # スタンドアロン domain が無い場合はスキップではなく engine 内の最小セット
          if [ ! -d "$ENG" ]; then echo "no engine dir"; exit 1; fi
          # フォーク上のエンジンは main 型に依存するため、JVM スモークは
          # magi-engine-rebuild 同梱スクリプトがあるときのみフル実行
          if [ -f scripts/ci-smoke-engine.sh ]; then
            bash scripts/ci-smoke-engine.sh
          else
            echo "scripts/ci-smoke-engine.sh not present — document-only pass"
            echo "Use magi-engine-rebuild/scripts/ci-smoke.sh for full JVM golden"
          fi

  assemble-debug-ndk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Install Gradle 9.3.1
        run: |
          wget -q -O /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          mkdir -p "$HOME/gradle-dist"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"
      - name: assembleDebug (NDK + REBUILD_ENGINE)
        run: |
          set -o pipefail
          mkdir -p build/ci-logs
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build/ci-logs/assembleDebug-rebuild.log
      - name: Verify native .so in APK
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK=$APK"
          unzip -l "$APK" | grep -E 'libmagi_native|arm64' || {
            echo "WARN: libmagi_native.so not listed — check NDK link"
            unzip -l "$APK" | head -40
          }
      - name: Upload logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-engine-ci-logs
          path: build/ci-logs/
          retention-days: 7
